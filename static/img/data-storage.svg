<svg id="svg" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <g id="svgg">
    <!-- ground shelf -->
    <rect x="20" y="366" width="360" height="7" rx="3.5" fill="#d3dbdb"/>
    <g transform="translate(0 -14)">

    <!-- stacked datastore -->
    <path d="M102 296 L102 340 A74 19 0 0 0 250 340 L250 296 Z" fill="#4db3e0"/>
    <path d="M102 252 L102 296 A74 19 0 0 0 250 296 L250 252 Z" fill="#4db3e0"/>
    <path d="M102 208 L102 252 A74 19 0 0 0 250 252 L250 208 Z" fill="#4db3e0"/>
    <ellipse cx="176" cy="208" rx="74" ry="19" fill="#d3dbdb"/>

    <!-- seams: one store highlighted by a metadata search -->
    <path d="M102 296 A74 19 0 0 0 250 296 L250 302 A74 19 0 0 1 102 302 Z" fill="#d3dbdb"/>
    <path d="M102 252 A74 19 0 0 0 250 252 L250 258 A74 19 0 0 1 102 258 Z" fill="#e5d83e"/>

    <!-- per-store status -->
    <g fill="#587c58">
      <circle cx="124" cy="320" r="3.6"/>
      <circle cx="124" cy="276" r="3.6"/>
      <circle cx="124" cy="232" r="3.6"/>
    </g>

    <!-- access control -->
    <path d="M168 205 L168 199 A8 8 0 0 1 184 199 L184 205" fill="none" stroke="#e46444" stroke-width="4" stroke-linecap="round"/>
    <rect x="163" y="205" width="26" height="20" rx="3" fill="#e46444"/>
    <circle cx="176" cy="214" r="2.4" fill="#d3dbdb"/>

    <!-- automatic upload into storage -->
    <g transform="translate(176 170) rotate(180)" fill="#587c58">
      <path d="M0 -7 L-10 13 L10 13 Z"/>
      <line x1="0" y1="9" x2="0" y2="64" stroke="#587c58" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.5 11"/>
    </g>

    <!-- search by metadata -->
    <circle cx="256" cy="302" r="30" fill="#d3dbdb"/>
    <circle cx="256" cy="302" r="30" fill="none" stroke="#4db3e0" stroke-width="7"/>
    <line x1="278" y1="324" x2="300" y2="346" stroke="#4db3e0" stroke-width="11" stroke-linecap="round"/>
  </g>
  </g>
</svg>
